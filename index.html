<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madrid Star 👑</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .auth-container {
            background-image: linear-gradient(45deg, #0f172a, #1e1b4b, #2e1065);
            background-size: 400% 400%;
            animation: colorShift 8s ease-in-out infinite alternate;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #334155;
            text-align: center; padding: 45px; border-radius: 16px; 
            max-width: 500px; width: 90%;
        }
        @keyframes colorShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(40deg); } }
        input {
            width: 100%; padding: 14px; margin-top: 8px;
            border-radius: 8px; border: 1px solid #334155; 
            background: #0f172a; color: white; font-size: 16px; 
            box-sizing: border-box; text-align: center;
        }
        button {
            width: 100%; padding: 14px; background: #2563eb; color: white; 
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; 
            cursor: pointer; margin-top: 20px;
        }
        a { color: #eab308; font-weight: bold; text-decoration: underline; font-size: 16px; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="authContent" class="auth-container">
        <h2>🔐 نظام حماية المدريديستا</h2>
        <p style="color: #94a3b8;">يرجى إدخال كلمات المرور المطلوبة للدخول</p>
        
        <div style="margin-bottom: 20px; text-align: right;">
            <label style="color: #60a5fa; font-weight: bold;">السطر الأول (كلمة المرور الأولى):</label>
            <input type="text" id="firstCode" placeholder="أدخل الكود الأول هنا...">
        </div>
        
        <div style="margin-bottom: 25px; text-align: right;">
            <label style="color: #60a5fa; font-weight: bold;">السطر الثاني (كلمة المرور الثانية):</label>
            <input type="text" id="secondCode" placeholder="أدخل الكود الثاني هنا...">
        </div>
        
        <button type="button" onclick="verifyCustomCodes()">التحقق من الأكواد والدخول 🚀</button>
        <p id="errorMsg" style="color: #ef4444; font-size: 18px; font-weight: bold; display: none; margin-top: 20px;">❌ الأكواد غير صحيحة!</p>
        
        <div style="margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px;">
            <p style="color: #94a3b8; font-size: 15px; margin: 0;">عشان تجيب الكود اضغط هذا الرابط:</p>
            <a href="https://sites.google.com/view/code-madred-star/" target="_blank">https://sites.google.com/view/code-madred-star/ 🔑</a>
        </div>
    </div>

    <div id="vipContent" style="display: none; width: 100%; max-width: 1200px; padding: 20px; text-align: center;">
        <h1 style="color: #eab308;">👑 أهلاً بك في Madrid Star 👑</h1>
        <div style="background: #1e293b; padding: 30px; border-radius: 8px; color: #60a5fa;">
            💬 هنا تضع كود الشات والبث الخاص بك وسيشتغل للأبد بدون أي حظر!
        </div>
    </div>

<script>
function verifyCustomCodes() {
    const code1 = document.getElementById('firstCode').value.trim();
    const code2 = document.getElementById('secondCode').value.trim();
    
    // الأكواد الجديدة والمطلوبة بالضبط
    const correctCode1 = "k1ngx8810j";
    const correctCode2 = "ma88109l";
    
    if (code1 === correctCode1 && code2 === correctCode2) {
        document.getElementById('authContent').style.display = 'none'; 
        document.getElementById('vipContent').style.display = 'block'; 
    } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('firstCode').value = ""; 
        document.getElementById('secondCode').value = "";
    }
}
</script>
</body>
</html>
